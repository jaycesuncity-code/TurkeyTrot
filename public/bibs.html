<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Bibs · Turkey Trot 5K</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/bibs.css">
</head>
<body>
  <div class="controls">
    <a href="/#/runners" class="back">← Back to runners</a>
    <h1>Print bibs</h1>
    <p>Two bibs per letter sheet. Print <b>portrait, Letter, 100% / Actual size</b>, with <b>Margins: None</b>, then cut each sheet exactly in half (5.5 in down, or fold it in half first). No cut marks print on the bibs.</p>
    <div class="ctl-row">
      <label>Sort by
        <select id="sort">
          <option value="bib">Bib number</option>
          <option value="last">Last initial</option>
        </select>
      </label>
      <label>Extra blank bibs (for walk-ups)
        <input id="blanks" type="number" min="0" max="60" value="0">
      </label>
      <button id="printBtn" type="button">🖨 Print</button>
    </div>
    <p id="summary" class="summary"></p>
  </div>
  <div id="sheets"></div>
  <script src="/shared.js"></script>
  <script src="/bibs.js"></script>
</body>
</html>
